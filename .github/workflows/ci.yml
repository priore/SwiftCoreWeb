name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install iOS Simulator runtime
        run: xcodebuild -downloadPlatform iOS
      - name: Build (iOS)
        run: xcodebuild build -scheme SwiftCoreWeb-Package -destination 'generic/platform=iOS Simulator'
      - name: Test (iOS Simulator)
        run: xcodebuild test -scheme SwiftCoreWeb-Package -destination 'platform=iOS Simulator,name=iPhone 16'
