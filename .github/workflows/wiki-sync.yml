name: Sync docs to GitHub Wiki

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Checkout wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy docs into wiki (flat, prefixed by subfolder), rewriting relative links
        run: |
          find wiki -maxdepth 1 -name "*.md" ! -name "_Sidebar.md" ! -name "_Footer.md" -delete
          python3 repo/scripts/wiki-flatten.py repo/docs wiki

      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync docs/ from ${{ github.sha }}"
            git push
          fi
