# ponytail: flat mirror, relative links between docs/ subfolders won't resolve on the wiki side
# (docs/README.md links to web/GETTING_STARTED.md, wiki has it at web-GETTING_STARTED.md instead).
# docs/ in the repo is the source of truth and always has working links; upgrade to link-rewriting
# only if the wiki copy's broken cross-links become an actual complaint.
name: Sync docs to GitHub Wiki

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Checkout wiki
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy docs into wiki (flat, prefixed by subfolder to avoid name collisions)
        run: |
          find wiki -maxdepth 1 -name "*.md" ! -name "_Sidebar.md" ! -name "_Footer.md" -delete
          cp repo/docs/README.md wiki/Home.md
          # docs/web/EXAMPLES_BASIC.md -> wiki/web-EXAMPLES_BASIC.md, docs/GLOSSARY.md -> wiki/GLOSSARY.md
          cd repo/docs
          find . -mindepth 1 -name "*.md" ! -path "./README.md" -print0 |
            while IFS= read -r -d "" file; do
              rel="${file#./}"
              flat="${rel//\//-}"
              cp "$rel" "../../wiki/$flat"
            done

      - name: Commit and push if changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync docs/ from ${{ github.sha }}"
            git push
          fi
