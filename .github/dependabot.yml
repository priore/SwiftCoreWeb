version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Package.swift pins swift-collections exactly on purpose (1.7.x needs a runtime symbol that older host systems lack).
      - dependency-name: "github.com/apple/swift-collections"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
